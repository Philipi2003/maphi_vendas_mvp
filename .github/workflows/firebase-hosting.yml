name: Firebase Hosting

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "flet[test]>=1.1.2" "flet-cli>=1.1.2" "flet-web>=1.1.2"

      - name: Run tests
        env:
          PROJECT_ID: test-project
        run: python -m pytest

      - name: Prepare public Firebase configuration
        shell: bash
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          AUTH_DOMAIN: ${{ vars.AUTH_DOMAIN }}
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET }}
          MESSAGING_SENDER_ID: ${{ vars.MESSAGING_SENDER_ID }}
          APP_ID: ${{ vars.APP_ID }}
          MEASUREMENT_ID: ${{ vars.MEASUREMENT_ID }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            for key in FIREBASE_API_KEY AUTH_DOMAIN PROJECT_ID STORAGE_BUCKET MESSAGING_SENDER_ID APP_ID MEASUREMENT_ID; do
              if [ -z "${!key}" ]; then
                echo "::error::Configure the $key Actions variable before deploying."
                exit 1
              fi
            done
          fi

          if [ -n "$FIREBASE_API_KEY" ]; then
            printf 'FIREBASE_API_KEY=%s\nAUTH_DOMAIN=%s\nPROJECT_ID=%s\nSTORAGE_BUCKET=%s\nMESSAGING_SENDER_ID=%s\nAPP_ID=%s\nMEASUREMENT_ID=%s\n' \
              "$FIREBASE_API_KEY" "$AUTH_DOMAIN" "$PROJECT_ID" "$STORAGE_BUCKET" \
              "$MESSAGING_SENDER_ID" "$APP_ID" "$MEASUREMENT_ID" > src/.env
          else
            : > src/.env
          fi

      - name: Build web app
        run: flet build web --include .env --yes

      - name: Remove temporary Firebase configuration
        if: always()
        run: rm -f src/.env

      - name: Verify deployment credential
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Configure the FIREBASE_SERVICE_ACCOUNT Actions secret before deploying."
            exit 1
          fi

      - name: Deploy to Firebase Hosting
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
